<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Links your exact global student page stylesheet -->
    <link rel="stylesheet" href="style.css">
    <title>UniHELP - Support Session History</title>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .history-box {
            max-width: 950px;
            margin: 40px auto;
            background: #fff;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0px 0px 10px rgba(0,0,0,0.1);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: center;
            border: 1px solid black;
        }
        th, td {
            border: 1px solid black;
            padding: 12px;
        }
    </style>
</head>
<body>

    <!-- EXACT STUDENT PAGE HEADER MATCH -->
    <header>
        <!-- Logo -->
        <div class="logo">
            <img src="GraduateIcon.png" alt="Graduation Icon">
            <h1>UniHELP</h1>
        </div>
        <!-- Navigation -->
        <nav class="menu" id="menu">
            <a href="studentpage.html">Home</a>
            <a href="">My Request</a>
            <a href="support_session_history.html">Session History</a>
            <a href="feedback.html">Feedback</a>
            <a href="">Profile</a>
            <a href="login.html">Logout</a>
        </nav>
    </header>

    <!-- Main Content Container matching style.css box styling -->
    <div class="history-box">
        <h1 style="font-size: 26px; text-align: center; margin-bottom: 30px; color: #000;">Support Session History</h1>

        <div style="overflow-x: auto;">
            <table>
                <thead>
                    <tr>
                        <th>Email</th>
                        <th>Support Category</th>
                        <th>Support Required</th>
                        <th>Date &amp; Time</th>
                        <th>Status</th>
                        <th>Rating</th>
                    </tr>
                </thead>
                <tbody>
               
                </tbody>
            </table>
        </div>
    </div>

    <hr style="margin-top: 50px; border: 0; border-top: 1px solid #ccc;">
    <footer>
        <p style="text-align: center; font-size: 14px; color: #666;">CopyRight®UniHelp System 2026</p>
    </footer>
</body>
</html>
